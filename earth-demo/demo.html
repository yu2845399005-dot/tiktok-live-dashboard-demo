<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Earth · 地球演示</title>
  <script>
    if (new URLSearchParams(location.search).get('embed') === 'dashboard') {
      document.documentElement.classList.add('dashboard-embed');
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    /* 加载提示层 */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: radial-gradient(ellipse at center, #06121f 0%, #000 70%);
      color: #9fc3e8;
      z-index: 20;
      transition: opacity 0.6s ease;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loader .ring {
      width: 54px;
      height: 54px;
      border: 3px solid rgba(120, 180, 255, 0.25);
      border-top-color: #6db4ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    #loader .label {
      font-size: 15px;
      letter-spacing: 1px;
    }
    #loader .label b {
      color: #cfe6ff;
    }

    /* HUD 说明 */
    #hud {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(210, 232, 255, 0.82);
      font-size: 13px;
      line-height: 1.7;
      background: rgba(6, 16, 30, 0.45);
      border: 1px solid rgba(120, 180, 255, 0.18);
      border-radius: 10px;
      padding: 12px 16px;
      backdrop-filter: blur(6px);
      z-index: 10;
      max-width: 300px;
    }
    #hud h1 {
      font-size: 15px;
      color: #bfe0ff;
      margin-bottom: 6px;
      font-weight: 600;
    }
    #hud .k {
      color: #6db4ff;
    }

    /* 信息指示 */
    #status {
      position: fixed;
      left: 18px;
      top: 16px;
      color: rgba(210, 232, 255, 0.9);
      font-size: 13px;
      background: rgba(6, 16, 30, 0.45);
      border: 1px solid rgba(120, 180, 255, 0.18);
      border-radius: 10px;
      padding: 8px 14px;
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    #status b {
      color: #cfe6ff;
    }
    #status .dim {
      color: #7ba6d6;
    }

    /* 语言切换（右上角） */
    #langBar {
      position: fixed;
      right: 18px;
      top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(210, 232, 255, 0.9);
      font-size: 13px;
      background: rgba(6, 16, 30, 0.45);
      border: 1px solid rgba(120, 180, 255, 0.18);
      border-radius: 10px;
      padding: 8px 12px;
      backdrop-filter: blur(6px);
      z-index: 30;
    }
    #langBar .navicon {
      font-size: 15px;
      color: #9fc3e8;
    }
    #langBar select {
      background: rgba(20, 40, 64, 0.9);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    #langBar select option {
      background: #0a1728;
      color: #dff1ff;
    }
    #langBar button {
      background: none;
      border: 1px solid rgba(120, 180, 255, 0.3);
      color: #9fc3e8;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 13px;
      cursor: pointer;
      line-height: 1.2;
    }
    #langBar button:hover {
      background: rgba(63, 140, 200, 0.35);
      color: #dff1ff;
    }

    canvas {
      display: block;
    }

    /* 保存/操作提示 toast */
    #toast {
      position: fixed;
      left: 50%;
      top: 20px;
      transform: translateX(-50%) translateY(-12px);
      background: rgba(6, 16, 30, 0.92);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.35);
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 30;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 让 lil-gui 面板可滚动，保证所有参数（含保存按钮）都能看到 */
    .lil-gui.root,
    .lil-gui {
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      overflow-x: hidden;
    }
    .lil-gui::-webkit-scrollbar {
      width: 8px;
    }
    .lil-gui::-webkit-scrollbar-thumb {
      background: rgba(120, 180, 255, 0.3);
      border-radius: 4px;
    }

    /* 飞线设置表格面板 */
    #flightPanel {
      position: fixed;
      left: 18px;
      top: 88px;
      width: 440px;
      max-height: calc(100vh - 210px);
      display: flex;
      flex-direction: column;
      background: rgba(6, 16, 30, 0.72);
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 12px;
      color: #dff1ff;
      font-size: 13px;
      z-index: 12;
      backdrop-filter: blur(8px);
      overflow: hidden;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    #flightPanel.collapsed .body,
    #flightPanel.collapsed .foot {
      display: none;
    }
    #flightPanel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-bottom: 1px solid rgba(120, 180, 255, 0.2);
      font-weight: 600;
      color: #bfe0ff;
    }
    #flightPanel header button {
      background: none;
      border: none;
      color: #8fb8e8;
      cursor: pointer;
      font-size: 13px;
    }
    #flightPanel .body {
      overflow-y: auto;
      padding: 8px 10px;
    }
    #flightPanel table {
      width: 100%;
      border-collapse: collapse;
    }
    #flightPanel th {
      text-align: left;
      color: #7ba6d6;
      font-weight: 600;
      padding: 3px 4px;
      font-size: 12px;
    }
    #flightPanel td {
      padding: 3px 4px;
    }
    #flightPanel select {
      width: 100%;
      background: rgba(20, 40, 64, 0.9);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 13px;
      outline: none;
    }
    #flightPanel .btns {
      white-space: nowrap;
    }
    #flightPanel .btns button {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid rgba(120, 180, 255, 0.3);
      background: rgba(40, 70, 110, 0.6);
      color: #dff1ff;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      margin-right: 3px;
    }
    #flightPanel .btns button.add:hover {
      background: #2f6f9f;
    }
    #flightPanel .btns button.del:hover {
      background: #a04040;
    }
    #flightPanel .addgroup {
      width: 100%;
      margin-top: 8px;
      padding: 7px 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: rgba(63, 120, 180, 0.25);
      color: #cfe6ff;
      font-size: 13px;
    }
    #flightPanel .addgroup:hover {
      background: rgba(63, 140, 200, 0.4);
    }
    #flightPanel .foot {
      padding: 8px 12px;
      border-top: 1px solid rgba(120, 180, 255, 0.2);
      color: #7ba6d6;
      font-size: 11px;
      line-height: 1.6;
    }

    /* 视图切换（地球 / 中国地图） */
    #viewToggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: rgba(6, 16, 30, 0.6);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.3);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      z-index: 12;
      backdrop-filter: blur(6px);
    }
    #viewToggle:hover {
      background: rgba(63, 140, 200, 0.35);
      color: #dff1ff;
    }

    /* 画布录屏（WebM/VP9 无损）：位于视图切换按钮上方 */
    #recordBar {
      position: fixed;
      right: 18px;
      bottom: 60px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 12;
      backdrop-filter: blur(6px);
    }
    #recordBtn {
      background: rgba(6, 16, 30, 0.6);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.3);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      min-width: 72px;
      text-align: center;
      white-space: nowrap;
    }
    #recordBtn:hover {
      background: rgba(63, 140, 200, 0.35);
      color: #dff1ff;
    }
    #recordBtn.recording {
      background: rgba(220, 60, 60, 0.9);
      color: #fff;
      border-color: rgba(255, 150, 150, 0.6);
      animation: recPulse 1.15s ease-in-out infinite;
    }
    @keyframes recPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    #recordQuality {
      background: rgba(6, 16, 30, 0.6);
      color: #dff1ff;
      border: 1px solid rgba(120, 180, 255, 0.3);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    #recordQuality:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* China 模式：隐藏地球相关 UI（中国地图自身的 .china-gui 面板由 JS 控制显示） */
    body.china-mode .lil-gui:not(.china-gui):not(.china-gui .lil-gui),
    body.china-mode #flightPanel,
    body.china-mode #hud,
    body.china-mode #status {
      display: none;
    }

    /* 中国地图工具提示 */
    #chinaTooltip {
      position: fixed;
      z-index: 40;
      pointer-events: none;
      background: rgba(6, 16, 30, 0.92);
      border: 1px solid rgba(120, 180, 255, 0.4);
      color: #dff1ff;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    /* 中国地图标题 + 返回 */
    #chinaHeader {
      position: fixed;
      left: 18px;
      top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(6, 16, 30, 0.6);
      border: 1px solid rgba(120, 180, 255, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      z-index: 12;
      backdrop-filter: blur(6px);
    }
    #chinaTitle {
      color: #bfe0ff;
      font-size: 14px;
      font-weight: 600;
    }
    #chinaBack {
      background: none;
      border: 1px solid rgba(120, 180, 255, 0.3);
      color: #9fc3e8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #chinaBack:hover {
      background: rgba(63, 140, 200, 0.35);
      color: #dff1ff;
    }
    #chinaEarthBack {
      background: none;
      border: 1px solid rgba(255, 210, 74, 0.4);
      color: #ffd24a;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #chinaEarthBack:hover {
      background: rgba(255, 210, 74, 0.2);
      color: #fff6d8;
    }

    /* China 模式加载提示 */
    #chinaLoading {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #9fc3e8;
      font-size: 15px;
      z-index: 40;
    }

    /* 下钻失败 / 无数据提示 */
    .chinaToast {
      position: fixed;
      left: 50%;
      top: 24px;
      transform: translateX(-50%);
      background: rgba(6, 16, 30, 0.94);
      color: #dff1ff;
      border: 1px solid rgba(255, 180, 120, 0.4);
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 50;
      opacity: 1;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .chinaToast.hide {
      opacity: 0;
      transform: translateX(-50%) translateY(-10px);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/",
        "lil-gui": "./vendor/lil-gui.esm.js"
      }
    }
  </script>

<style>
  #langBar, #viewToggle, #recordBar, #status, #hud, #flightPanel,
  .lil-gui, #earthChinaTip, #chinaHeader, #chinaLoading { display: none !important; }
  #loader.hidden { visibility: hidden; }
  body { background: #000; color: #e6edff; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
  .presentation-head { position:fixed; top:30px; left:36px; z-index:6; pointer-events:none; transition:opacity .3s; }
  .eyebrow { font-size:10px; font-weight:500; letter-spacing:3px; color:#727e9a; }
  .presentation-head h1 { font-size:20px; font-weight:500; letter-spacing:.2px; margin-top:9px; }
  .presentation-head small { display:block; margin-top:9px; color:#57617a; font-size:11px; }
  .demo-controls { position:fixed; z-index:10; bottom:30px; left:50%; transform:translateX(-50%); display:flex; gap:7px; align-items:center; padding:9px; border:1px solid #242a40; background:rgba(9,12,23,.82); border-radius:12px; backdrop-filter:blur(20px); transition:opacity .3s; white-space:nowrap; }
  .demo-controls button { border:1px solid transparent; padding:9px 13px; background:transparent; border-radius:7px; color:#aab3ca; cursor:pointer; font:inherit; font-size:12px; }
  .demo-controls button:hover { color:#fff; background:#1a2238; }
  .demo-controls button[aria-pressed=true] { background:#17253f; color:#c5d8ff; }
  .demo-controls label { border-left:1px solid #283044; padding:0 12px; display:flex; gap:12px; align-items:center; font-size:12px; color:#8793ad; }
  .demo-controls input { width:85px; accent-color:#6d94fc; }
  .help { position:fixed; bottom:40px; right:32px; z-index:5; font-size:10px; color:#505970; letter-spacing:.4px; transition:opacity .3s; pointer-events:none; }
  .source-link { position:fixed; top:35px; right:34px; z-index:8; color:#56617b; font-size:11px; text-decoration:none; transition:opacity .3s; }
  .source-link:hover { color:#b6c6e7; }
  body.clean .demo-controls, body.clean .presentation-head, body.clean .help, body.clean .source-link { opacity:0; pointer-events:none; }
  :focus-visible { outline:2px solid #8eacff; outline-offset:3px; }
  @media (max-width:900px) { .help { bottom:100px; right:50%; transform:translateX(50%); white-space:nowrap; } }
  @media (max-width:600px) { .presentation-head { left:22px; top:24px; } .presentation-head h1 { font-size:17px; } .source-link { right:22px; top:27px; font-size:10px; } .demo-controls { width:calc(100% - 24px); bottom:18px; gap:2px; flex-wrap:wrap; justify-content:center; } .demo-controls button { padding:8px 10px; } .demo-controls label { padding:0 8px; } .demo-controls input { width:62px; } .help { bottom:118px; } }
  html.dashboard-embed, .dashboard-embed body { background: transparent; }
  .dashboard-embed .presentation-head, .dashboard-embed .demo-controls,
  .dashboard-embed .help, .dashboard-embed .source-link { display: none; }
  .dashboard-embed #loader { background: transparent; }
  .dashboard-embed #loader .label { font-size: 12px; color: #7e90b0; }
  .dashboard-embed canvas { touch-action: none; }
  .dashboard-embed #app { opacity: 0; }
  .dashboard-embed body.ready #app { opacity: 1; }
  .dashboard-embed #loader { display: none; }
  .dashboard-embed body.load-failed #loader { display: flex; }

</style>
</head>
<body>
  <div id="app"></div>

  <!-- 加载层 -->
  <div id="loader">
    <div class="ring"></div>
    <div class="label"><span data-i18n="loader.text">正在加载地球纹理</span> <b id="progress">0%</b></div>
  </div>

  <!-- 操作提示 -->
  <div id="toast"></div>

  <!-- 语言切换 -->
  <div id="langBar">
    <span class="navicon">🌐</span>
    <select id="langSelect" data-i18n-title="lang.placeholder"></select>
    <button id="langRefresh" data-i18n-title="lang.refreshTitle" title="刷新语言列表">⟳</button>
  </div>

  <!-- 视图切换（地球 / 中国地图） -->
  <button id="viewToggle">🗺️ 中国地图</button>

  <!-- 画布录屏（WebM/VP9 无损 + 低占用） -->
  <div id="recordBar">
    <button id="recordBtn" data-i18n="rec.start">🎬 录制</button>
    <select id="recordQuality" data-i18n-title="rec.title" title="画质">
      <option value="high" data-i18n="rec.qualityHigh">高画质</option>
      <option value="mid" selected data-i18n="rec.qualityMid">均衡</option>
      <option value="small" data-i18n="rec.qualitySmall">高压缩</option>
    </select>
  </div>

  <!-- 状态信息 -->
  <div id="status">
    <span data-i18n="status.sourcePrefix">地图来源：</span><b>NASA Blue Marble</b><span data-i18n="status.sourceSuffix"> · 贴图：8K</span><br />
    <span class="dim" data-i18n="status.features">昼夜交替 &nbsp;·&nbsp; 云层 &nbsp;·&nbsp; 大气辉光 &nbsp;·&nbsp; 星空闪烁 &nbsp;·&nbsp; 护罩·能量波</span>
  </div>

  <!-- 操作说明 -->
  <div id="hud">
    <h1 data-i18n="hud.title">🌍 三维真实地球</h1>
    <div><span class="k" data-i18n="hud.drag">拖动</span><span data-i18n="hud.dragDesc">：旋转视角</span></div>
    <div><span class="k" data-i18n="hud.scroll">滚轮</span><span data-i18n="hud.scrollDesc">：缩放</span></div>
    <div><span class="k" data-i18n="hud.pan">右键拖动</span><span data-i18n="hud.panDesc">：平移</span></div>
    <div style="margin-top:6px;opacity:.75" data-i18n="hud.note">
      已移除太阳与月球，仅保留昼夜光照。
    </div>
  </div>

  <!-- 飞线设置表格 -->
  <div id="flightPanel">
    <header>
      <span class="title" data-i18n="flight.title">✈️ 飞线设置</span>
      <button id="flightPanelToggle" data-i18n-title="flight.collapseTitle" title="收起/展开" data-i18n="flight.collapse">收起</button>
    </header>
    <div class="body">
      <table>
        <thead>
          <tr><th data-i18n="flight.colSource">起点城市</th><th data-i18n="flight.colTarget">终点城市</th><th data-i18n="flight.colAction">操作</th></tr>
        </thead>
        <tbody id="flightTbody"></tbody>
      </table>
      <button id="flightAddGroup" class="addgroup" data-i18n="flight.addGroup">＋ 新增分组（1 起点 + n 终点）</button>
    </div>
    <div class="foot" data-i18n="flight.foot">
      同一行：起点=该组开头城市，终点=该组一个终点。点「＋」复制本行起点以增加同一组的终点；「－」删除本行。
    </div>
  </div>

  
  <header class="presentation-head"><p class="eyebrow">GLOBAL EARTH</p><h1>全球区域 · 地球演示</h1><small>夜景地球 / 左上方主光 / 区域光点</small></header>
  <a class="source-link" href="./index.html" target="_blank" rel="noopener">查看原版 ↗</a>
  <nav class="demo-controls" aria-label="地球演示控制">
    <button id="rotate" aria-pressed="false">自动旋转</button>
    <button id="reset">复位视角</button>
    <button id="points" aria-pressed="true">区域光点</button>
    <label>辉光 <input id="glow" aria-label="辉光强度" type="range" min="0" max="2" step="0.05" value="1"></label>
    <button id="fullscreen">全屏</button>
  </nav>
  <p class="help">拖动旋转 · 滚轮缩放 · H 隐藏界面</p>
  <script type="module">
    try { await import('./js/presentation.js?v=20261105-particle-polish'); }
    catch (error) {
      document.body.classList.add('load-failed');
      document.querySelector('#loader .label').textContent = '地球加载失败，请刷新页面重试';
      document.getElementById('loader').classList.remove('hidden');
      if (parent !== window) parent.postMessage({type:'earth:failed'}, location.origin);
      console.error(error);
    }
  </script>
</body>
</html>
